services:
  app:
    build: .
    ports:
      - '3000:3000'
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      DATABASE_PATH: /app/data/app.db
    volumes:
      - data:/app/data
    init: true
    stop_grace_period: 15s

volumes:
  data:
